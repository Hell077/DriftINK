[package]
name = "driftink"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Hell077/DriftINK"

[dependencies]
calloop = { version = "0.14", features = ["signals"] }
calloop-wayland-source = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["xkbcommon"] }
wayland-client = "0.31"
tiny-skia = "0.12"
fontdue = "0.9"

[dev-dependencies]
tempfile = "3"
wayland-protocols = { version = "0.32", features = ["client"] }
